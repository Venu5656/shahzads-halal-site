services:
  db:
    image: postgres:16-alpine
    container_name: shahzads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shahzad
      POSTGRES_PASSWORD: shahzad
      POSTGRES_DB: shahzads
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shahzad -d shahzads"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
