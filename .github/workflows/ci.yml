name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://shahzad:shahzad@localhost:5432/shahzads?schema=public
  # CI-only throwaway value; the real one lives in the deployment's secrets.
  AUTH_SECRET: ci-secret-not-used-anywhere-real-000000
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shahzad
          POSTGRES_PASSWORD: shahzad
          POSTGRES_DB: shahzads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shahzad -d shahzads"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shahzad
          POSTGRES_PASSWORD: shahzad
          POSTGRES_DB: shahzads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shahzad -d shahzads"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium webkit
      # The auth tests sign up and log in for real against the database above.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
